name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Confluence embed URL
        id: confluence-url
        shell: bash
        run: |
          epoch="$(date +%s)"
          page_url="${{ steps.deployment.outputs.page_url }}"
          embed_url="${page_url}?v=${epoch}"

          echo "url=${embed_url}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Confluence embed URL::${embed_url}"
          printf '## Confluence embed URL\n\n[%s](%s)\n\n```text\n%s\n```\n' \
            "${embed_url}" "${embed_url}" "${embed_url}" \
            >> "${GITHUB_STEP_SUMMARY}"
